    <!-- Global Client Error Capture Script -->
    <script>
      window.addEventListener('error', function(e) {
        console.error('Captured global error:', e);
        const errorDiv = document.createElement('div');
        errorDiv.style.position = 'fixed';
        errorDiv.style.top = '0';
        errorDiv.style.left = '0';
        errorDiv.style.width = '100%';
        errorDiv.style.background = '#fef2f2';
        errorDiv.style.color = '#991b1b';
        errorDiv.style.padding = '20px';
        errorDiv.style.borderBottom = '3px solid #ef4444';
        errorDiv.style.zIndex = '999999';
        errorDiv.style.fontFamily = 'monospace';
        errorDiv.style.fontSize = '14px';
        errorDiv.style.whiteSpace = 'pre-wrap';
        errorDiv.style.boxShadow = '0 4px 6px -1px rgba(0,0,0,0.1)';
        errorDiv.innerHTML = '<h3 style="font-weight:bold;margin-bottom:8px;">[CLIENT RUNTIME CRASH]</h3>' + e.message + '<br/><br/>' + (e.error ? e.error.stack : '');
        document.body.appendChild(errorDiv);
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.error('Captured global promise rejection:', e);
        const errorDiv = document.createElement('div');
        errorDiv.style.position = 'fixed';
        errorDiv.style.top = '0';
        errorDiv.style.left = '0';
        errorDiv.style.width = '100%';
        errorDiv.style.background = '#fef2f2';
        errorDiv.style.color = '#991b1b';
        errorDiv.style.padding = '20px';
        errorDiv.style.borderBottom = '3px solid #ef4444';
        errorDiv.style.zIndex = '999999';
        errorDiv.style.fontFamily = 'monospace';
        errorDiv.style.fontSize = '14px';
        errorDiv.style.whiteSpace = 'pre-wrap';
        errorDiv.style.boxShadow = '0 4px 6px -1px rgba(0,0,0,0.1)';
        const reason = e.reason && e.reason.stack ? e.reason.stack : (e.reason || 'Unknown Rejection');
        errorDiv.innerHTML = '<h3 style="font-weight:bold;margin-bottom:8px;">[UNHANDLED PROMISE REJECTION]</h3>' + reason;
        document.body.appendChild(errorDiv);
      });
    </script>
